<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sitsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="sitsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadowSits" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#sitsBg)" />
  <circle cx="700" cy="120" r="150" fill="#3b82f6" fill-opacity="0.1" filter="blur(60px)" />
  <circle cx="120" cy="380" r="140" fill="#6366f1" fill-opacity="0.08" filter="blur(50px)" />

  <!-- Frame -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadowSits)" />

  <!-- Header -->
  <rect x="40" y="30" width="720" height="44" rx="12" fill="#1e293b" fill-opacity="0.6" />
  <circle cx="65" cy="52" r="5" fill="#ef4444" />
  <circle cx="82" cy="52" r="5" fill="#f59e0b" />
  <circle cx="99" cy="52" r="5" fill="#10b981" />
  <text x="400" y="57" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="500">SITS Identity &amp; Access Control Suite • Angular + .NET Core API</text>

  <!-- Top Metric Cards (3 cards) -->
  <rect x="60" y="90" width="215" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
  <text x="80" y="114" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Active Directory Users</text>
  <text x="80" y="142" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">12,450</text>
  <circle cx="245" cy="125" r="16" fill="#3b82f6" fill-opacity="0.2" />
  <text x="245" y="130" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">👥</text>

  <rect x="292" y="90" width="215" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
  <text x="312" y="114" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Security Token Grants</text>
  <text x="312" y="142" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">99.98%</text>
  <circle cx="477" cy="125" r="16" fill="#10b981" fill-opacity="0.2" />
  <text x="477" y="130" fill="#34d399" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">🔒</text>

  <rect x="525" y="90" width="215" height="70" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" />
  <text x="545" y="114" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roles &amp; Policy Rules</text>
  <text x="545" y="142" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">64 Active</text>
  <circle cx="710" cy="125" r="16" fill="#8b5cf6" fill-opacity="0.2" />
  <text x="710" y="130" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">🛡️</text>

  <!-- User Table / Matrix -->
  <rect x="60" y="176" width="680" height="254" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="rgba(255,255,255,0.06)" />
  <text x="80" y="206" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Enterprise User Directory &amp; Permissions</text>
  
  <!-- Table Header -->
  <rect x="80" y="222" width="640" height="30" rx="4" fill="#0f172a" />
  <text x="100" y="242" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="600">USER / IDENTITY</text>
  <text x="280" y="242" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ASSIGNED ROLES</text>
  <text x="460" y="242" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="600">AUTH METHOD</text>
  <text x="620" y="242" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="600">STATUS</text>

  <!-- Table Row 1 -->
  <rect x="80" y="258" width="640" height="42" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.03)" />
  <circle cx="110" cy="279" r="12" fill="#3b82f6" />
  <text x="110" y="283" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">DM</text>
  <text x="132" y="278" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Dasun Mendis</text>
  <text x="132" y="291" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Global Administrator</text>
  <rect x="280" y="269" width="85" height="18" rx="4" fill="#6366f1" fill-opacity="0.25" />
  <text x="322" y="282" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Full Access</text>
  <text x="460" y="283" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">JWT + 2FA (MFA)</text>
  <rect x="620" y="269" width="60" height="18" rx="9" fill="#059669" fill-opacity="0.25" />
  <text x="650" y="282" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Active</text>

  <!-- Table Row 2 -->
  <rect x="80" y="306" width="640" height="42" rx="4" fill="#1e293b" fill-opacity="0.3" stroke="rgba(255,255,255,0.03)" />
  <circle cx="110" cy="327" r="12" fill="#8b5cf6" />
  <text x="110" y="331" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">AK</text>
  <text x="132" y="326" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Alex Kumar</text>
  <text x="132" y="339" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">DevOps Engineer</text>
  <rect x="280" y="317" width="95" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
  <text x="327" y="330" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">CI/CD Deployer</text>
  <text x="460" y="331" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">OAuth2 Bearer</text>
  <rect x="620" y="317" width="60" height="18" rx="9" fill="#059669" fill-opacity="0.25" />
  <text x="650" y="330" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Active</text>

  <!-- Table Row 3 -->
  <rect x="80" y="354" width="640" height="42" rx="4" fill="#1e293b" fill-opacity="0.3" stroke="rgba(255,255,255,0.03)" />
  <circle cx="110" cy="375" r="12" fill="#f59e0b" />
  <text x="110" y="379" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ES</text>
  <text x="132" y="374" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Emma Smith</text>
  <text x="132" y="387" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Auditor</text>
  <rect x="280" y="365" width="80" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
  <text x="320" y="378" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Read Only</text>
  <text x="460" y="379" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">SAML 2.0</text>
  <rect x="620" y="365" width="60" height="18" rx="9" fill="#059669" fill-opacity="0.25" />
  <text x="650" y="378" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Active</text>
</svg>
