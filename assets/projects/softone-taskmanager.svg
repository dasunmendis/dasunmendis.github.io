<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad1)" />
  <circle cx="700" cy="80" r="180" fill="#06b6d4" fill-opacity="0.08" filter="blur(60px)" />
  <circle cx="100" cy="400" r="140" fill="#8b5cf6" fill-opacity="0.1" filter="blur(50px)" />

  <!-- Window Frame -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow1)" />
  
  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="44" rx="12" fill="#1e293b" fill-opacity="0.6" />
  <circle cx="65" cy="52" r="5" fill="#ef4444" />
  <circle cx="82" cy="52" r="5" fill="#f59e0b" />
  <circle cx="99" cy="52" r="5" fill="#10b981" />
  <text x="400" y="57" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="500">SoftOne Task Manager • Angular Client + .NET Core API</text>

  <!-- Sidebar -->
  <rect x="40" y="74" width="160" height="376" fill="#0b1120" fill-opacity="0.5" />
  <rect x="56" y="96" width="128" height="28" rx="6" fill="url(#accentGrad1)" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1"/>
  <text x="90" y="115" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Sprint Board</text>
  <rect x="56" y="134" width="128" height="24" rx="6" fill="transparent" />
  <text x="90" y="150" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Backlog (42)</text>
  <rect x="56" y="168" width="128" height="24" rx="6" fill="transparent" />
  <text x="90" y="184" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">API Analytics</text>
  <rect x="56" y="202" width="128" height="24" rx="6" fill="transparent" />
  <text x="90" y="218" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Team Members</text>

  <!-- Kanban Column 1: To Do -->
  <rect x="220" y="94" width="165" height="336" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="rgba(255,255,255,0.05)" />
  <text x="234" y="118" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">To Do</text>
  <rect x="350" y="106" width="22" height="16" rx="8" fill="#334155" />
  <text x="361" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">3</text>
  
  <!-- Card 1.1 -->
  <rect x="230" y="134" width="145" height="80" rx="6" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.08)" />
  <rect x="240" y="146" width="45" height="14" rx="3" fill="#0284c7" fill-opacity="0.25" />
  <text x="262" y="157" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Backend</text>
  <text x="240" y="176" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">JWT Refresh Token Flow</text>
  <circle cx="355" cy="198" r="10" fill="#3b82f6" />
  <text x="355" y="201" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">DM</text>

  <!-- Card 1.2 -->
  <rect x="230" y="224" width="145" height="74" rx="6" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.08)" />
  <rect x="240" y="236" width="45" height="14" rx="3" fill="#10b981" fill-opacity="0.2" />
  <text x="262" y="247" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Angular</text>
  <text x="240" y="266" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Async Pipe &amp; Signals</text>

  <!-- Kanban Column 2: In Progress -->
  <rect x="395" y="94" width="165" height="336" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="rgba(255,255,255,0.05)" />
  <text x="409" y="118" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">In Progress</text>
  <rect x="525" y="106" width="22" height="16" rx="8" fill="#0284c7" fill-opacity="0.3" />
  <text x="536" y="118" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">2</text>

  <!-- Card 2.1 -->
  <rect x="405" y="134" width="145" height="96" rx="6" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1" />
  <rect x="415" y="146" width="55" height="14" rx="3" fill="#8b5cf6" fill-opacity="0.25" />
  <text x="442" y="157" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">API Core</text>
  <text x="415" y="176" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">CQRS Query Handlers</text>
  <rect x="415" y="196" width="125" height="4" rx="2" fill="#334155" />
  <rect x="415" y="196" width="85" height="4" rx="2" fill="url(#accentGrad1)" />

  <!-- Kanban Column 3: Completed -->
  <rect x="570" y="94" width="165" height="336" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="rgba(255,255,255,0.05)" />
  <text x="584" y="118" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">Done (Sprint 14)</text>
  <rect x="700" y="106" width="22" height="16" rx="8" fill="#059669" fill-opacity="0.3" />
  <text x="711" y="118" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">8</text>

  <!-- Card 3.1 -->
  <rect x="580" y="134" width="145" height="74" rx="6" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.08)" />
  <rect x="590" y="146" width="60" height="14" rx="3" fill="#10b981" fill-opacity="0.25" />
  <text x="620" y="157" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Architecture</text>
  <text x="590" y="176" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Repository Layer Base</text>
</svg>
