<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="posBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="posAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadowPos" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#posBg)" />
  <circle cx="120" cy="100" r="160" fill="#10b981" fill-opacity="0.08" filter="blur(60px)" />
  <circle cx="680" cy="380" r="140" fill="#06b6d4" fill-opacity="0.08" filter="blur(50px)" />

  <!-- Frame -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadowPos)" />

  <!-- Header -->
  <rect x="40" y="30" width="720" height="44" rx="12" fill="#1e293b" fill-opacity="0.6" />
  <circle cx="65" cy="52" r="5" fill="#ef4444" />
  <circle cx="82" cy="52" r="5" fill="#f59e0b" />
  <circle cx="99" cy="52" r="5" fill="#10b981" />
  <text x="400" y="57" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-weight="500">Enterprise Point of Sale (POS) &amp; Inventory Suite • .NET &amp; SQL Server</text>

  <!-- Left Side: Product Grid -->
  <rect x="60" y="94" width="420" height="336" rx="8" fill="#1e293b" fill-opacity="0.3" stroke="rgba(255,255,255,0.05)" />
  <text x="80" y="122" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Quick Items Catalog</text>
  
  <!-- Category Pills -->
  <rect x="230" y="108" width="60" height="20" rx="10" fill="url(#posAccent)" />
  <text x="260" y="122" fill="#042f2e" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Retail</text>
  <rect x="298" y="108" width="60" height="20" rx="10" fill="#334155" />
  <text x="328" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Hardware</text>
  <rect x="366" y="108" width="60" height="20" rx="10" fill="#334155" />
  <text x="396" y="122" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Pharma</text>

  <!-- Product Item Grid (4 items) -->
  <rect x="80" y="146" width="180" height="110" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
  <rect x="92" y="158" width="36" height="36" rx="6" fill="#10b981" fill-opacity="0.2" />
  <text x="110" y="180" fill="#34d399" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">📦</text>
  <text x="136" y="172" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">SKU #8841-A</text>
  <text x="136" y="188" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Stock: 142 units</text>
  <text x="92" y="238" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">$124.50</text>
  <rect x="200" y="222" width="48" height="22" rx="4" fill="#0284c7" />
  <text x="224" y="237" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ Add</text>

  <rect x="280" y="146" width="180" height="110" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
  <rect x="292" y="158" width="36" height="36" rx="6" fill="#3b82f6" fill-opacity="0.2" />
  <text x="310" y="180" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">⚡</text>
  <text x="336" y="172" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">SKU #4109-B</text>
  <text x="336" y="188" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Stock: 89 units</text>
  <text x="292" y="238" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">$45.00</text>
  <rect x="400" y="222" width="48" height="22" rx="4" fill="#0284c7" />
  <text x="424" y="237" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ Add</text>

  <!-- Stats Banner bottom -->
  <rect x="80" y="274" width="380" height="136" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
  <text x="100" y="300" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Daily Revenue Metrics</text>
  <path d="M100 380 L160 350 L220 360 L280 320 L340 330 L400 295 L440 300" fill="none" stroke="url(#posAccent)" stroke-width="3" stroke-linecap="round"/>
  <text x="380" y="380" fill="#10b981" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">+18.4% Today</text>

  <!-- Right Side: Order Summary -->
  <rect x="500" y="94" width="240" height="336" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="rgba(255,255,255,0.08)" />
  <text x="520" y="124" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Active Order #POS-981</text>
  
  <rect x="520" y="146" width="200" height="1" fill="#334155" />
  <text x="520" y="170" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">SKU #8841-A  x1</text>
  <text x="700" y="170" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">$124.50</text>
  <text x="520" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">SKU #4109-B  x2</text>
  <text x="700" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">$90.00</text>

  <rect x="520" y="225" width="200" height="1" fill="#334155" />
  <text x="520" y="250" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Tax (8%)</text>
  <text x="700" y="250" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="end">$17.16</text>
  
  <text x="520" y="290" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">Total: $231.66</text>
  
  <!-- Checkout CTA -->
  <rect x="520" y="320" width="200" height="42" rx="8" fill="url(#posAccent)" />
  <text x="620" y="346" fill="#042f2e" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" text-anchor="middle">💳 COMPLETE SALE</text>
  <text x="620" y="390" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Synced with MS SQL Server</text>
</svg>
